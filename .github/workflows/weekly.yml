name: Generate Global AI Weekly

on:
  schedule:
    # GitHub Actions uses UTC. 02:00 UTC = 10:00 Asia/Taipei.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-ai-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report and send digest
        run: python -m ai_weekly.cli --root .

      - name: Commit report and history
        run: |
          git config user.name "ai-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/state.json
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "report: add AI weekly $(date -u +%F)"
            git push
          fi
